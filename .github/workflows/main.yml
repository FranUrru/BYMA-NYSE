name: Run Market Screener Daily

on:
  schedule:
    # 07:00 UTC equivale a las 04:00 AM de Argentina (ART)
    # Se ejecuta de Martes (2) a Sábado (6) para procesar las ruedas de Lunes a Viernes
    - cron: '0 7 * * 2-6'
  workflow_dispatch: # Mantiene la opción de ejecutarlo manualmente cuando quieras

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias necesarias
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas

    - name: Ejecutar Screener Técnico y Enviar Mail
      # Aquí mapeamos los Secrets guardados en GitHub hacia las variables de entorno del script
      env:
        SMTP_SERVER: "smtp.gmail.com"
        SMTP_PORT: 587
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
      run: python reporter.py
